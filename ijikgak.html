<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이직각</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — status header, scrolling feed, bottom tab bar; sheets slide up from the bottom like a real job app. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --sunk:#f3f5f8; --ink:#141b2d; --muted:#667089; --line:#d6dce6;
  --accent:#2445d4; --accent-ink:#ffffff; --accent-soft:#e3e8fc;
  --mail:#c98a00; --mail-soft:#fbf0d4;
  --good:#16895c; --good-soft:#dcf2e8; --bad:#c93b35; --bad-soft:#f8e0de; --warn:#b86a00;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 6px 20px rgba(20,27,45,.06);
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121d; --surface:#161d2c; --sunk:#111827; --ink:#e7ebf3; --muted:#8e99b1; --line:#283149;
  --accent:#7f95ff; --accent-ink:#0d121d; --accent-soft:#1f2a4d;
  --mail:#f2c14a; --mail-soft:#3a3016;
  --good:#3cc58d; --good-soft:#143428; --bad:#ff6d64; --bad-soft:#3d1a1a; --warn:#f0a43a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d121d; --surface:#161d2c; --sunk:#111827; --ink:#e7ebf3; --muted:#8e99b1; --line:#283149;
  --accent:#7f95ff; --accent-ink:#0d121d; --accent-soft:#1f2a4d;
  --mail:#f2c14a; --mail-soft:#3a3016;
  --good:#3cc58d; --good-soft:#143428; --bad:#ff6d64; --bad-soft:#3d1a1a; --warn:#f0a43a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);border-inline:1px solid var(--line)}
/* sky: the feed background follows the in-game clock (dawn → noon → sunset → night); cards stay opaque so text contrast never changes */
.app{background:linear-gradient(180deg,var(--sky1,var(--bg)) 0%,var(--sky2,var(--bg)) 70%)}
.sky{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),var(--gc,transparent) 0,transparent var(--gr,34%))}
.app>header,.app>main,.app>nav{position:relative;z-index:1}
main{background:transparent}
.app>header.hd{background:color-mix(in srgb,var(--surface) 62%,var(--sky1,var(--surface)))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hd{background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;display:grid;gap:8px}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.date b{color:var(--ink);font-weight:600}
.sphint{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.hd.paused .sphint{color:var(--warn)}
.timebar{display:flex;gap:8px;align-items:center}
.play{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadow)}
.play svg{width:16px;height:16px;fill:currentColor}
.hd.paused .play{background:var(--accent);color:var(--accent-ink);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.speed{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.speed button{height:34px;border-radius:9px;font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap}
.speed button.on{background:var(--ink);color:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.hd.paused .speed button.last{box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--ink)}
.hp{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;min-width:0}
.hp span{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.bar.mid i{background:var(--warn)} .bar.low i{background:var(--bad)}
.hp b{font-family:var(--f-num);font-size:13.5px;font-weight:600;min-width:3.6em;text-align:right;white-space:nowrap}
.money{font-family:var(--f-num);font-size:13px;white-space:nowrap}
.money.neg{color:var(--bad)}
.status{font-size:12.5px;padding-top:2px;border-top:1px dashed var(--line);padding-top:6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--ink);font-weight:600}

/* main */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:14px 24px;-webkit-overflow-scrolling:touch}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* priority: hero (do this now) > card > flat (reference) */
.hero{border:1.5px solid var(--accent);background:var(--accent-soft);box-shadow:none}
.hero .eyebrow{color:var(--accent)}
.hero h2{font-size:22px}
.hero .sub{color:var(--ink);opacity:.8;margin-top:4px}
.hero .btn{margin-top:12px;width:100%}
.hero.urgent{border-color:var(--mail);background:var(--mail-soft)}
.hero.urgent .eyebrow{color:var(--mail)}
.hero.urgent .btn{background:var(--mail);color:#1b1404}
.hero.calm{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.hero.calm .btn{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.card.flat{background:transparent;box-shadow:none;border-style:dashed}
.card.flat h3{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.pausebar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--warn);color:var(--warn);font-weight:600;font-size:13.5px}
.pausebar svg{width:14px;height:14px;fill:currentColor}

/* pixel character */
.mecard{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;padding:12px 14px}
.avatar{width:104px;height:124px;border-radius:12px;background:linear-gradient(180deg,var(--sky1,var(--sunk)) 0%,var(--sunk) 78%);border:1px solid var(--line);display:grid;place-items:end center;overflow:hidden}
.avatar canvas{width:96px;height:120px;image-rendering:pixelated;image-rendering:crisp-edges}
.mood{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:2px 0 3px}
.mood.good{color:var(--good)} .mood.warn{color:var(--warn)} .mood.bad{color:var(--bad)}
.doing{display:inline-block;margin-top:7px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* stat meters */
.meters{display:grid;gap:7px;margin-top:10px}
.meter{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.meter .bar{height:6px}
.meter .bar i{background:var(--accent)}
.meter em{font-style:normal;font-family:var(--f-num);font-size:12px;text-align:right;color:var(--muted)}

/* actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 11px;display:grid;gap:2px}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{font-size:15px}
.act small{font-size:12px;color:var(--muted);line-height:1.35}
.act.danger b{color:var(--bad)}
.progress{margin-top:10px;display:grid;gap:6px}
.progress .bar{height:10px}
.progress .bar i{background:var(--accent)}

.log{display:grid;gap:0;margin-top:6px}
.log div{font-size:12.5px;padding:7px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:72px 1fr;gap:8px}
.log div:first-child{border-top:0}
.log time{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}

/* chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
button.chip{cursor:pointer}
button.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.want{border-style:dashed}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mail{background:var(--mail-soft);color:var(--mail)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tier{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tier.t4,.tier.t5{border-color:var(--accent);color:var(--accent)}

/* segmented */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:7px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* posting */
.post{display:grid;gap:6px;width:100%}
.post .co{font-weight:600;font-size:13px}
.ptitle{font-family:var(--f-display);font-size:20px;line-height:1.2}
.sal{font-size:13px;color:var(--muted)}
.sal .short{color:var(--bad);font-weight:600}
.sal b{font-family:var(--f-num);font-size:19px;font-weight:700;color:var(--ink);margin-right:2px}
.chip.have{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.chip.have::before{content:"✓ "}
button.chip.hit:not(.on){border-color:var(--good);color:var(--good);font-weight:600}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .num{color:var(--ink)}
.rate{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rate .star{color:var(--mail);font-weight:700}
.new{color:var(--bad);font-weight:700;font-size:11px;letter-spacing:.05em}
.applied{opacity:.6}

/* mail */
.inbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;align-items:start}
.mrow:first-child{border-top:0}
.mrow .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.mrow.unread .dot{background:var(--mail)}
.mstar{color:var(--mail);font-size:14px;line-height:1}
.x.keep.on{color:var(--mail);border-color:var(--mail)}
.mrow .from{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mrow.imp.unread{box-shadow:inset 3px 0 0 var(--mail);background:color-mix(in srgb,var(--mail-soft) 45%,var(--surface))}
.mrow.unread .from{color:var(--ink);font-weight:600}
.mrow .subj{font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mrow.unread .subj{font-weight:600}
.mrow time{font-family:var(--f-num);font-size:11px;color:var(--muted);white-space:nowrap}
.grade{font-family:var(--f-num);font-size:30px;font-weight:600;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.grade.gS{background:var(--mail);color:#fff}
.gparts{display:grid;gap:6px}
.gparts div{display:grid;grid-template-columns:1fr auto 3em;gap:8px;font-size:13px;align-items:center}
.gparts em{font-style:normal;color:var(--muted);text-align:right;font-family:var(--f-num)}
.mbody{font-size:14px;line-height:1.7;white-space:pre-line;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.btns .btn:has(.bfx){flex-direction:column;gap:2px}
.bfx{display:block;font-size:11.5px;font-weight:500;opacity:.85}

/* nav */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{display:grid;justify-items:center;gap:3px;padding:8px 0 8px;font-size:12px;color:var(--muted);position:relative;isolation:isolate}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:5px;left:50%;width:52px;height:30px;margin-left:-26px;border-radius:99px;background:var(--accent-soft);z-index:-1}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-num)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:90%;overflow-y:auto;border-radius:18px 18px 0 0;padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);animation:up .22s ease-out}
.overlay.center .sheet{border-radius:18px;max-height:92%;padding-bottom:16px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.x{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sec{display:grid;gap:8px}
.sec + .sec{margin-top:16px}
.label{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.reviews{display:grid;gap:6px}
.review{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.review::before{content:"“";color:var(--muted);margin-right:2px}
.review::after{content:"”";color:var(--muted);margin-left:2px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:18px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat s{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.projpick{display:grid;gap:6px}
.proj{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;display:grid;gap:4px;width:100%}
button.proj.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.proj b{font-size:13.5px}
.feel{font-family:var(--f-display);font-size:20px}

/* interview */
.iv-q{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px;font-size:15px;line-height:1.55}
.iv-opts{display:grid;gap:6px}
.iv-opts button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:14px}
.iv-opts button:hover{border-color:var(--accent)}
.iv-react{font-style:italic;color:var(--muted);text-align:center;padding:10px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:24px;height:4px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--accent)}

/* tree */
.tree{display:grid;gap:0;margin-top:6px}
.tnode{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:4px 0;position:relative}
.tnode .pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-left:4px;z-index:1;font-family:var(--f-num);font-size:10px;display:grid;place-items:center;color:var(--muted)}
.tnode.got .pip{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tnode.now .pip{box-shadow:0 0 0 4px var(--accent-soft)}
.tnode .tt{font-size:13.5px}
.tnode.got .tt{font-weight:600}
.tnode.lock .tt{color:var(--muted);letter-spacing:.12em;font-family:var(--f-num)}
.tnode.lock .tt small{letter-spacing:0;font-family:var(--f-body)}
.tnode.lock .pip{border-style:dashed}
.tnode .tt small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.tline{width:2px;height:12px;background:var(--line);margin-left:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.branch{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--sunk)}
.branch.pick{border-color:var(--accent);background:var(--accent-soft)}
.branch.off{opacity:.45}
.branch h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.hist{display:grid;gap:8px}
.hitem{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.hitem.cur{border-color:var(--accent)}

/* push */
.gauges{display:grid;gap:5px}
.hp{position:relative}
.bar.money i{background:var(--accent)}
.bar.money.mid i{background:var(--warn)} .bar.money.low i{background:var(--bad)}
.mnum.neg{color:var(--bad)}
.flow{font-size:11.5px;color:var(--muted);padding-left:38px;font-variant-numeric:tabular-nums}
.flow .plus{color:var(--good);font-weight:600} .flow .minus{color:var(--bad);font-weight:600}
.delta{position:absolute;right:0;top:-14px;font-style:normal;font-family:var(--f-num);font-size:12px;font-weight:600;opacity:0;pointer-events:none}
.delta.go{animation:dl 1.6s ease-out}
.delta.plus{color:var(--good)} .delta.minus{color:var(--bad)}

function plevel(){

function genCompany(t,used){
 let name;do{name=pick(PRE)+pick(t>=4?SUF_BIG.concat(SUF.slice(0,3)):SUF);}while(used.has(name));used.add(name);
 const wlb=clamp(Math.round(R(0.6,5.4)+(t>=4?0.5:0)-(t<=2?0.6:0)),1,5);
 const env=clamp(Math.round(R(0.6,4.2)+t*0.3),1,5);
 const growth=clamp(Math.round(R(0.6,5.4)+(t===2?0.4:0)),1,5);
 const reviews=RI(3,28)*t+RI(0,9);
 const amp=clamp(3/Math.sqrt(reviews),0.3,1.4);
 const d=v=>Math.round(clamp(v+R(-amp,amp),1,5)*10)/10;
 const culture=pick(CULT);
 const c={name,tier:t,ind:pick(IND),wlb,env,growth,culture,reviews,dw:d(wlb),de:d(env),dg:d(growth),known:false,insider:false};
 c.rating=Math.round(clamp((c.dw+c.de+c.dg)/3+R(-0.3,0.3),1,5)*10)/10;
 const rv=[];
 rv.push(pick(CULT_REV[Math.random()<0.72?culture:pick(CULT)]));
 const keys=['wlb','env','growth'];const kk=pick(keys);const tv=c[kk];
 const truthful=Math.random()<0.8;const good=truthful?(tv>=3):(tv<3);
 rv.push(pick(STAT_REV[kk][good?1:0]));
 if(Math.random()<0.5){const k2=pick(keys.filter(x=>x!==kk));rv.push(pick(STAT_REV[k2][c[k2]>=3?1:0]));}
 c.rv=rv;
 if(t<=2&&Math.random()<0.1){
  c.shady=true;c.wlb=RI(1,2);c.env=RI(1,3);c.growth=RI(2,3);c.reviews=RI(2,7);
  c.dw=+R(4.1,4.8).toFixed(1);c.de=+R(4.2,4.9).toFixed(1);c.dg=+R(4.3,4.9).toFixed(1);c.rating=+R(4.5,4.9).toFixed(1);

 }
 return c;
}

function genPosting(opt){
 opt=opt||{};
 const pl=plevel(),y=yrs();
 let L=opt.L||clamp(pl+pick([-1,0,0,0,1,1,2]),1,6);
 if(!opt.L){if(y<2&&Math.random()<0.55)L=1;if(y>=2&&L===1)L=2;
  // most postings you could plausibly get; ~30% stay out of reach
  if(REQY[L-1]>y+2&&Math.random()<0.7){while(L>1&&REQY[L-1]>y+2)L--;if(y>=2&&L===1)L=2;}}
 let t=opt.t||wpick(TIERW)+1;if(L>=5&&t<3)t=RI(3,5);if(L===6&&t<4&&Math.random()<0.6)t=RI(4,5);
 const all=S.companies.filter(c=>c.tier===t),open=all.filter(c=>!c.closed);const c=pick(open.length?open:all);
 const br=L>=5?(Math.random()<0.5?'ic':'m'):null;
 const base=[2800,3600,4800,6200,8500,13000][L-1],mult=[0,0.78,0.9,1,1.2,1.55][t];
 return {id:nid(),co:c.name,tier:t,level:L,branch:br,title:titleOf(L,br),kws:sample(T().kw,3),reqYears:REQY[L-1],
  salary:Math.round(base*mult*R(0.92,1.1)*(c.shady?R(1.3,1.6):1)/100)*100,until:S.day+RI(10,30),posted:S.day,applied:false};
}

/* ---------- mail & log ---------- */
function addMail(m,silent){
 m.id=nid();m.day=S.day;m.read=false;m.done=false;S.mails.unshift(m);
 if(S.mails.length>80){for(let i=S.mails.length-1;i>=0&&S.mails.length>80;i--)if(!S.mails[i].star)S.mails.splice(i,1);}
 UI.dirty=true;
 if(UI.away){if(silent)return;UI.away.n++;if(isImp(m)){UI.away.imp.push(m.subject);if(OPT.pauseImp&&UI.away.stop==null)UI.away.stop=S.day;}if(document.hidden)sysNote(m);return;}
 if(!silent)pushNote(m);
 if(!silent&&S.speed>=3&&OPT.pauseImp&&needAct(m)){UI.lastSp=UI.impSp=S.speed;S.speed=0;UI.dirty=true;}
}
// result mails keep the outcome sealed: the board and home show only "결과 도착" until the player opens one of that application's mails
function result(a,logText,m){addMail(m);m.log=logText;a.pend=m.id;}
function hidden(a){return !!(a.pend&&S.mails.some(m=>m.id===a.pend&&!m.read));}
function log(t){S.log.unshift({d:S.day,t});if(S.log.length>40)S.log.length=40;UI.dirty=true;}
// events land at a random office hour (09:00–18:30) unless exact
function sched(day,kind,data){const at=data&&data.exact?day:Math.floor(day)+R(0.375,0.77);S.q.push(Object.assign({kind},data||{},{day:at}));}
function runDue(){const t=S.day+(S.frac||0);if(!S.q.some(e=>e.day<=t))return;const due=S.q.filter(e=>e.day<=t).sort((a,b)=>a.day-b.day);S.q=S.q.filter(e=>e.day>t);due.forEach(handle);}
function deliver(m){if(m.money)S.money+=m.money;if(m.hp)S.hp=clamp(S.hp+m.hp,0,100);addMail(m);}
function remind(a){sched(a.deadline-1+0.4,'remind',{app:a.id,exact:true});}

/* ---------- applying ---------- */
function req(p){return p.level*22+p.tier*9-14;}
function calcPower(p,res){
 const y=yrs(),k=S.skill,c=co(p.co);
 let pw=Math.min(y,p.reqYears+3)*4+k.prac*0.5+k.collab*0.3;
 if(p.level>=4)pw+=k.lead*(p.branch==='m'?0.7:0.25);
 if(p.level>=5&&p.branch==='ic')pw+=k.prac*0.2;
 pw+=res.kws.filter(x=>p.kws.includes(x)).length*5;
 res.projects.forEach(id=>{const pr=proj(id);if(pr)pw+=pr.q/12+pr.tags.filter(t=>p.kws.includes(t)).length*3;});
 if(c&&res.tone===c.culture)pw+=4;
 pw-=Math.min(20,Math.max(0,S.blankDays-60)/30*2);
 if(y<p.reqYears)pw-=(p.reqYears-y)*8;
 pw-=hops()*6;
 pw-=recentLeaves()*7;
 pw+=maxTier()*2;
 return pw;
}
function hops(){return S.history.filter(h=>h.reason==='이직'&&h.end-h.start<365).length;}
function recentLeaves(){return (S.leaveLog||[]).filter(d=>S.day-d<1095).length;}
function feel(p){
 if(p>=0.62)return[_('해볼 만하다','Good shot'),'good'];
 if(p>=0.38)return[_('반반이다','Coin flip'),''];
 if(p>=0.16)return[_('상향 지원이다','A reach'),'mail'];
 return[_('기적을 바라는 지원','Praying for a miracle'),'bad'];
}
function submitApp(p,res){
 const pw=calcPower(p,res),rq=req(p),pDoc=clamp(sig((pw-rq)/10),0.02,0.95);
 const app={id:nid(),p:JSON.parse(JSON.stringify(p)),res,pw,rq,pDoc,stage:'doc',day:S.day};
 S.apps.unshift(app);p.applied=true;S.stats.applied++;S.hp=Math.max(0,S.hp-1.5);
 addMail(EN?{from:`${p.co} Recruiting`,subject:`[${p.co}] We received your application`,body:`Hi ${S.name},\nThank you for applying for the ${p.title} position.\n\nWe'll let you know once we've reviewed your resume.\nReview times vary by position.`}
  :{from:`${p.co} 채용팀`,subject:`[${p.co}] 지원이 정상적으로 접수되었습니다`,body:`안녕하세요, ${S.name}님.\n${p.title} 포지션에 지원해 주셔서 감사합니다.\n\n서류 검토 후 결과를 안내드리겠습니다.\n검토 기간은 포지션 상황에 따라 다를 수 있습니다.`},true);
 if(Math.random()<0.15)sched(S.day+45,'ghost',{app:app.id});
 else sched(S.day+Math.round(2+Math.pow(Math.random(),1.6)*20),'doc',{app:app.id});
 log(_(`${p.co} · ${p.title}에 지원했다.`,`Applied to ${p.co} · ${p.title}.`));

}

/* ---------- celebration ---------- */
function fireworks(dur,big){
 if(document.hidden||!window.requestAnimationFrame)return;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const W=innerWidth,H=innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);
 const cv=document.createElement('canvas');cv.className='fx';cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
 document.body.appendChild(cv);const g=cv.getContext('2d');g.scale(dpr,dpr);
 const COL=['#ff5a5f','#ffb400','#3cc58d','#4f8cff','#b46bff','#ff7ac6','#ffe14d','#4fd6e8'];
 const P=[],R=[],C=[];const G=0.06;let t0=performance.now(),last=t0,nextL=0;
 const burst=(x,y,c)=>{const n=reduce?26:(big?90:70),ring=Math.random()<.3;
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.15,sp=ring?4.2:1+Math.random()*4.6;
   P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.011+Math.random()*.009,c:Math.random()<.2?'#fff':c,r:1.4+Math.random()*1.8});}};
 const launch=()=>{const x=W*(.12+Math.random()*.76),ty=H*(.12+Math.random()*.3);R.push({x,y:H+6,vx:(Math.random()-.5)*1.2,vy:-Math.sqrt(2*G*(H-ty)),c:COL[Math.floor(Math.random()*COL.length)]});};
 for(let i=0;i<(reduce?30:big?160:110);i++)C.push({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:1.5+Math.random()*2.5,a:Math.random()*6,va:(Math.random()-.5)*.3,w:5+Math.random()*5,h:8+Math.random()*6,c:COL[i%COL.length]});
 burst(W*.5,H*.32,COL[1]);if(!reduce){burst(W*.22,H*.4,COL[0]);burst(W*.78,H*.38,COL[3]);}
 const step=now=>{const dt=Math.min(3,(now-last)/16.7),t=now-t0;last=now;
  if(t<dur&&now>=nextL&&!reduce){launch();nextL=now+(big?220:340)+Math.random()*260;}
  g.clearRect(0,0,W,H);
  for(let i=R.length-1;i>=0;i--){const r=R[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy+=G*dt;
   g.fillStyle=r.c;g.beginPath();g.arc(r.x,r.y,2.2,0,7);g.fill();
   if(r.vy>=-.4){burst(r.x,r.y,r.c);R.splice(i,1);}}
  g.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.97,dt);p.vy=p.vy*Math.pow(.97,dt)+G*.55*dt;p.l-=p.d*dt;
   if(p.l<=0){P.splice(i,1);continue;}g.globalAlpha=Math.min(1,p.l*1.4);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();}
  g.globalCompositeOperation='source-over';
  for(let i=C.length-1;i>=0;i--){const q=C[i];q.x+=(q.vx+Math.sin(q.a)*.6)*dt;q.y+=q.vy*dt;q.a+=q.va*dt;
   if(q.y>H+20){if(t<dur*.6){q.y=-20;q.x=Math.random()*W;}else{C.splice(i,1);continue;}}
   g.globalAlpha=1;g.save();g.translate(q.x,q.y);g.rotate(q.a);g.scale(1,Math.cos(q.a*2));g.fillStyle=q.c;g.fillRect(-q.w/2,-q.h/2,q.w,q.h);g.restore();}
  g.globalAlpha=1;
  if(t<dur||P.length||R.length||C.length)requestAnimationFrame(step);else cv.remove();};
 requestAnimationFrame(step);
 try{navigator.vibrate&&navigator.vibrate(big?[40,60,40,60,120]:[30,50,30]);}catch(e){}
}

const ACTS=EN?{
 study:{name:'Self-study',days:10,desc:j=>`10 days · HP -${j?14:5} · Skill↑, new keyword`,hp:j=>j?14:5},
 side:{name:'Side project',days:21,desc:j=>`21 days · HP -${j?20:7} · Portfolio +1`,hp:j=>j?20:7},
 network:{name:'Networking',days:3,desc:j=>`3 days · HP -${j?4:2} · ${MW(10)} · Teamwork↑, intel`,hp:j=>j?4:2},
 rest:{name:'Take PTO',days:3,desc:()=>`3 days · 3 PTO days · HP +24`,hp:()=>-24},
 ot:{name:'Overtime',days:5,desc:()=>`5 days · HP -${otHp()} · Leadership↑${otFam()<1?' (still new to the job)':''}`,hp:()=>otHp()}
}:{
 study:{name:'자기계발',days:10,desc:j=>`10일 · 체력 -${j?14:5} · 실무↑, 새 키워드`,hp:j=>j?14:5},
 side:{name:'사이드 프로젝트',days:21,desc:j=>`21일 · 체력 -${j?20:7} · 포트폴리오 +1`,hp:j=>j?20:7},
 network:{name:'네트워킹',days:3,desc:j=>`3일 · 체력 -${j?4:2} · 10만원 · 협업↑, 정보`,hp:j=>j?4:2},
 rest:{name:'연차 휴가',days:3,desc:()=>`3일 · 연차 3개 · 체력 +24`,hp:()=>-24},
 ot:{name:'야근',days:5,desc:()=>`5일 · 체력 -${otHp()} · 리더십↑${otFam()<1?' (아직 일이 낯설다)':''}`,hp:()=>otHp()}
};
// overtime: leadership comes from knowing the job, so it pays off only after ~6 months there,
// and back-to-back overtime (within 30 days) costs more and more HP
function otN(){return S.otLast!=null&&S.day-S.otLast<30?(S.otN||0)+1:0;}
function otFam(){const j=S.job;return j?Math.min(1,(S.day-j.start)/180):0;}
function otHp(){const j=S.job;if(!j)return 0;return Math.round(16*(1+otN()*0.5)*(1+(3-j.wlb)*0.15));}
function startAct(type){
 const A=ACTS[type],j=!!S.job;
 if(type==='rest'){if(S.leave<3)return;S.leave-=3;}
 if(type==='network')S.money-=10;
 const hp=A.hp(j);if(type==='ot')S.otN=otN();
 S.action={type,start:S.day,end:S.day+A.days,per:hp/A.days};
 log(_(`${A.name} 시작.`,`Started: ${A.name}.`));UI.dirty=true;save();
}
function finishAct(){
 const a=S.action;S.action=null;const k=S.skill;
 if(a.type==='study'){
  k.prac+=(3.2+R(0,1))*Math.pow(1-k.prac/110,2);
  const nk=T().kw.filter(x=>!myKws().includes(x));
  if(nk.length&&Math.random()<0.6){const w=pick(nk);S.learned.push(w);log(_(`자기계발 완료. 실무가 늘고 '${w}'를 익혔다.`,`Finished self-study. Skills up, and you picked up '${w}'.`));}
  else log(_('자기계발 완료. 실무가 조금 늘었다.','Finished self-study. Skills went up a little.'));
 }else if(a.type==='side'){
  const kws=myKws();const tags=[pick(kws.length?kws:T().kw),pick(T().kw)].filter((v,i,ar)=>ar.indexOf(v)===i);
  const q=Math.round(clamp(18+k.prac*0.6+R(0,22),10,98));
  const name=pick(_(['토이 ','개인 ','오픈소스 ','실험용 ','미니 '],['Toy ','Personal ','Open-source ','Experimental ','Mini ']))+pick(T().proj);
  S.projects.unshift({id:nid(),name,tags,q,day:S.day});
  tags.forEach(t=>{if(!S.learned.includes(t))S.learned.push(t);});
  log(_(`사이드 프로젝트 '${name}' 완성 (완성도 ${q}).`,`Finished side project '${name}' (quality ${q}).`));
 }else if(a.type==='network'){
  k.collab+=2.5*(1-k.collab/150);
  const r=Math.random();
  if(r<0.35){
   const c=pick(S.companies.filter(x=>!x.insider&&!x.known));
   if(c){c.insider=true;addMail(EN?{from:'Senior from college',subject:`Heard about ${c.name}?`,body:`Thanks for the coffee yesterday.\nAbout ${c.name}: a friend who works there says\nwork-life balance ${c.wlb}, environment ${c.env}, growth ${c.growth}, roughly.\nThe culture is all '${CN[c.culture]}'.${c.shady?"\n\nBut I heard they've been paying salaries late. Don't go just for the money.":''}\n\nJust FYI!`}
    :{from:'대학 선배',subject:`${c.name} 얘기 들었어?`,body:`어제 커피 고마웠어.\n말한 ${c.name} 말인데, 거기 다니는 친구 말로는\n워라밸 ${c.wlb}점, 근무환경 ${c.env}점, 성장 ${c.growth}점 정도래.\n분위기는 완전 '${c.culture}' 쪽이고.${c.shady?'\n\n근데 거기 요즘 월급 밀린다는 소문이 있더라. 연봉만 보고 가지 마.':''}\n\n참고만 해!`});}
  }else if(r<0.55&&yrs()>=1)headhunter();
  log(_('네트워킹을 했다. 아는 사람이 늘었다.','Did some networking. You know more people now.'));
 }else if(a.type==='ot'){
  const j=S.job;S.otLast=S.day;
  if(j){const f=otFam(),d=3.2*f*(0.6+j.growth*0.15)*(1+k.collab/100)*(S.branch==='m'?1.3:1)*Math.pow(Math.max(0,1-k.lead/110),1.3);k.lead+=d;
   log(f<1?_(`야근을 마쳤다. 아직 일이 낯설어 남는 게 적다. (리더십 +${d.toFixed(1)})`,`Finished the overtime. Still new here, so not much stuck. (Leadership +${d.toFixed(1)})`):_(`야근을 마쳤다. 일이 손에 익는다. (리더십 +${d.toFixed(1)})`,`Finished the overtime. The work is starting to feel like yours. (Leadership +${d.toFixed(1)})`));}
 }else if(a.type==='rest')log(_('연차를 쓰고 푹 쉬었다.','Took PTO and rested well.'));
 UI.dirty=true;
}

function headhunter(){
 const pl=plevel();const L=clamp(pl+(Math.random()<0.4?1:0),2,6);
 const t=clamp(Math.max(maxTier(),2)+RI(0,1),2,5);
 const p=genPosting({L,t});
 addMail(EN?{from:'Director Kim, Headhunter',subject:`[Opportunity] ${p.co} ${p.title}`,body:`Hi ${S.name},\nI came across your profile and wanted to reach out.\n\n${p.co} (${TIER[p.tier]}) is quietly hiring for a ${p.title} role.\n• Salary: around ${MW(p.salary)}\n• Nice to have: ${p.kws.join(', ')}\n\nLet me know if you're interested. I'll pass your resume along right away.`,type:'hh',post:p}
  :{from:'헤드헌터 김 이사',subject:`[포지션 제안] ${p.co} ${p.title}`,body:`안녕하세요, ${S.name}님.\n링크드 프로필을 보고 연락드립니다.\n\n${TIER[p.tier]} ${p.co}에서 ${p.title} 포지션을 비공개로 채용 중입니다.\n• 연봉: ${p.salary.toLocaleString()}만원 내외\n• 우대: ${p.kws.join(', ')}\n\n관심 있으시면 회신 부탁드립니다. 서류는 제가 바로 넘기겠습니다.`,type:'hh',post:p});
}

/* ---------- money: lifestyle creep and big life bills ---------- */
// living cost drifts toward 160 + 30% of take-home pay; it rises fast and falls slowly
function monthly(){
 const j=S.job;if(S.life==null)S.life=160;
 if(j&&!j.leaveUntil){const net=j.salary/12*0.82,tg=160+0.3*Math.max(0,net-160);S.life+=(tg-S.life)*(tg>S.life?0.25:0.08);}
 else S.life+=(160-S.life)*0.08;
 S.life=Math.max(160,S.life);
 S.money-=Math.round(S.life);
 lifeEvents();
}
function bill(m){m.type='bill';m.deadline=S.day+7;addMail(m);sched(m.deadline+1,'billExp',{mail:m.id,exact:true});}
function payBill(m,i,auto){
 const o=m.opts[i];m.done=true;m.pick=i;
 S.money+=o.money||0;S.hp=clamp(S.hp+(o.hp||0),0,100);
 if(o.fx==='small')S.life=Math.max(160,S.life-30);
 if(o.fx==='car')S.car=true;
 if(o.fx==='wage')sched(S.day+RI(60,120),'wage',{amt:Math.round(o.owed*0.7)});
 if(o.fx==='wed')S.life+=50;
 if(o.fx==='home'){S.home=true;S.homeVal=(S.homeVal||0)-o.money;S.life=Math.max(160,S.life-40);}
 log(`${m.subject.replace(/^\[[^\]]+\] /,'')}: ${o.label}${auto?_(' (기한이 지나 자동 처리)',' (auto-picked after the deadline)'):''}`);UI.dirty=true;
}
function lifeEvents(){
 const y=S.day/365,j=S.job;S.ev=S.ev||{};
 const rk='rent'+Math.floor(S.day/730);
 if(!S.home&&S.day>=730&&!S.ev[rk]){S.ev[rk]=1;const x=Math.round((800+S.life*4)/100)*100;
  bill(EN?{from:'Landlord',subject:'[Lease] Renewal notice',body:`Your lease is ending soon.\nPrices have gone up a lot, so I'll need another ${MW(x)} on the deposit.\n\nIf that's hard, you're free to look elsewhere.\n(Moving to a smaller place costs moving fees and tires you out, but lowers living costs.)`,opts:[{label:'Pay the increase',money:-x},{label:'Move somewhere smaller',money:-150,hp:-8,fx:'small'}],def:1}
   :{from:'집주인',subject:'[전세] 계약 갱신 안내',body:`계약 만료가 다가와 연락드립니다.\n요즘 시세가 많이 올라서 보증금을 ${x.toLocaleString()}만원 올려 주셔야 할 것 같아요.\n\n어려우시면 다른 집을 알아보셔도 됩니다.\n(작은 집으로 옮기면 이사비가 들고 지치지만, 생활비가 줄어듭니다.)`,opts:[{label:'올려 준다',money:-x},{label:'작은 집으로 이사',money:-150,hp:-8,fx:'small'}],def:1});return;}
 if(j&&!S.ev.wed&&y>=4&&Math.random()<0.03){S.ev.wed=1;
  bill(EN?{from:'Partner',subject:'Should we set a date?',body:'We\'ve been together a long time.\nLet\'s decide together: a big wedding, or something small, just us.\n\n(Living together raises living costs a little.)',opts:[{label:'Big wedding',money:-3000,hp:12,fx:'wed'},{label:'Small wedding',money:-800,hp:6,fx:'wed'}],def:1}
   :{from:'연인',subject:'우리 이제 날 잡을까?',body:'만난 지도 꽤 됐잖아.\n식을 크게 할지, 둘이서 조촐하게 할지 같이 정하자.\n\n(둘이 살면 생활비가 조금 늘어납니다.)',opts:[{label:'식 올리기',money:-3000,hp:12,fx:'wed'},{label:'스몰웨딩',money:-800,hp:6,fx:'wed'}],def:1});return;}
 if(y>=3&&(S.ev.hosp||0)<3&&Math.random()<0.015){S.ev.hosp=(S.ev.hosp||0)+1;const x=RI(4,12)*100;
  bill(EN?{from:'Mom',subject:'Dad is in the hospital',body:`Don't panic.\nDad's test results weren't good, so he's been admitted.\nThey say the bill will be about ${MW(x)}.\n\nI'm sorry to put this on you.`,opts:[{label:'Send all of it',money:-x},{label:'Send half',money:-Math.round(x/2),hp:-10}],def:0}
   :{from:'엄마',subject:'아빠가 입원하셨다',body:`놀라지 말고 들어라.\n아빠 검사 결과가 안 좋아서 입원하셨다.\n병원비가 ${x.toLocaleString()}만원쯤 나온다는구나.\n\n너한테 이런 말 해서 미안하다.`,opts:[{label:'전부 보낸다',money:-x},{label:'반만 보낸다',money:-Math.round(x/2),hp:-10}],def:0});return;}
}

/* ---------- daily tick ---------- */
function tick(){
 S.day++;
 const wd=dateOf(S.day).getDay(),weekend=wd===0||wd===6;
 const j=S.job,k=S.skill;
 let onLeave=false;
 if(j){
  if(j.leaveUntil){
   onLeave=true;S.hp+=1.6;S.blankDays++;
   if(S.day>=j.leaveUntil){
    j.leaveUntil=0;
    if(S.stats.leaves>=6){endGame('health');return;}
    if(j.leaves>=2){const n=j.co;endJob('권고사직');addMail(EN?{from:`${n} HR`,subject:'About our meeting',body:'Following your two leaves of absence, here is the outcome of our review.\n\nFor the sake of your health, the company has decided to end your contract.\nThank you for all your work.'}:{from:`${n} 인사팀`,subject:'면담 결과 안내',body:'두 차례 휴직 이후 면담 결과를 안내드립니다.\n\n회사는 귀하의 건강을 위해 계약을 종료하는 것이 맞다고 판단했습니다.\n그동안 수고 많으셨습니다.'});log(_(`${n}에서 권고사직 처리됐다.`,`Pushed out of ${n} ("encouraged to resign").`));if(!S.over&&S.history.filter(h=>h.reason==='권고사직').length>=3)endGame('rep');}
    else{addMail(EN?{from:`${j.co} HR`,subject:'Return to work',body:'Your leave has ended.\nPlease come back to work starting tomorrow.\n\nTake it easy. If you collapse again, there won\'t be much we can do.'}:{from:`${j.co} 인사팀`,subject:'복직 안내',body:'휴직 기간이 종료되었습니다.\n내일부터 정상 출근 바랍니다.\n\n무리하지 마세요. 한 번 더 쓰러지면 회사도 어쩔 수 없습니다.'});log(_('휴직이 끝나 복직했다.','Leave ended. Back to work.'));}
   }
  }else{
   S.careerDays++;S.blankDays=Math.max(0,S.blankDays-0.3);
   const ten=(S.day-j.start)/365;
   const resting=S.action&&S.action.type==='rest';
   // a new job wears you out more; after ~2 years you've settled in
   const drain=(weekend||resting)?0:(0.4+(5-j.wlb)*0.4)*(1.1-Math.min(0.3,ten*0.15))*0.8;
   const regen=weekend?j.env*0.9+(S.car?1:0):j.env*0.04;
   S.hp+=regen-drain;
   const g=j.growth,acc=1+Math.min(0.5,ten*0.25);
   k.prac+=0.012*g*acc*(1-k.prac/140);
   k.collab+=0.008*g*acc*(1-k.collab/140);
   k.lead+=0.0015*g*(1-k.lead/140);
   const td=S.day-j.start;
   if(td%30===0&&td<365)S.leave++;
   if(td%30===0){const full=Math.round(j.salary/12*0.82);
    if(j.shady==='bust'){const pay=Math.round(full*0.5);S.money+=pay;j.owed+=full-pay;
     addMail(EN?{from:`${j.co} Finance`,subject:'[Notice] About this month\'s payroll',body:`Due to company circumstances, we are paying only 50% of this month's salary for now.\nThe rest will be paid as soon as the investment comes in.\n\nThank you for understanding.\n\n(Unpaid wages so far: ${MW(j.owed)})`}
     :{from:`${j.co} 경영지원팀`,subject:'[공지] 이번 달 급여 지급 일정 안내',body:`회사 사정으로 이번 달 급여의 50%만 우선 지급합니다.\n나머지는 투자금이 들어오는 대로 바로 지급하겠습니다.\n\n양해 부탁드립니다.\n\n(밀린 월급: ${j.owed.toLocaleString()}만원)`});}
    else S.money+=full;}
   if(td%150===0){
    const q=Math.round(clamp(22+g*9+R(0,15)+k.prac*0.15,10,98));
    const pn=`${j.co} `+pick(_(['서비스 리뉴얼','신규 런칭','고도화 프로젝트','마이그레이션','대형 캠페인','해외 진출'],['Service Revamp','New Launch','Platform Upgrade','Migration','Big Campaign','Global Expansion']));
    S.projects.unshift({id:nid(),name:pn,tags:sample(j.kws,2),q,day:S.day});log(_(`회사 프로젝트 '${pn}'을 마쳤다 (완성도 ${q}).`,`Finished the work project '${pn}' (quality ${q}).`));
   }
   if(td%365===0){
    S.leave=15;
    const pl=plevel();
    if(pl>j.level&&Math.random()<0.12+g*0.07){
     j.level++;j.title=titleOf(j.level,j.level>=5?(S.branch||'ic'):null);j.salary=Math.round(j.salary*1.15/100)*100;
     addMail(EN?{from:`${j.co} HR`,subject:'[HR] Your annual review',body:`Here are the results of this year's review.\n\nCongratulations, you've been promoted to ${j.title}.\nSalary: ${MW(j.salary)}`}:{from:`${j.co} 인사팀`,subject:'[인사] 연봉 계약 결과 안내',body:`올해 평가 결과를 안내드립니다.\n\n축하합니다. ${j.title}(으)로 승진하셨습니다.\n연봉: ${j.salary.toLocaleString()}만원`});log(_(`${j.title}(으)로 승진했다!`,`Promoted to ${j.title}!`));
    }else{
     const r=[1.0,1.02,1.03,1.05][RI(0,3)];j.salary=Math.round(j.salary*r/10)*10;
     addMail(EN?{from:`${j.co} HR`,subject:'[HR] Your annual review',body:`Here are the results of this year's review.\n\nRaise: ${Math.round((r-1)*100)}%\nSalary: ${MW(j.salary)}\n\n${r<=1.02?'Times are tough for the company. Thank you for understanding.':'Looking forward to another great year.'}`}:{from:`${j.co} 인사팀`,subject:'[인사] 연봉 계약 결과 안내',body:`올해 평가 결과를 안내드립니다.\n\n연봉 인상률: ${Math.round((r-1)*100)}%\n연봉: ${j.salary.toLocaleString()}만원\n\n${r<=1.02?'회사 사정이 어려워 양해 부탁드립니다.':'내년에도 잘 부탁드립니다.'}`});
    }
   }
   if(!weekend&&Math.random()<0.012){
    if(j.wlb<=2&&Math.random()<0.5)sched(S.day,'mail',{m:EN?{from:'Team lead',subject:'Can you pop in this weekend?',body:'Something urgent came up.\nIt won\'t take long. (Probably.)\n\n(There goes the weekend. HP -5)',hp:-5}:{from:'팀장님',subject:'이번 주말에 잠깐 나올 수 있어요?',body:'급한 건이 생겨서요.\n오래 안 걸릴 거예요. (아마도)\n\n(주말을 반납했다. 체력 -5)',hp:-5}});
    else sched(S.day,'mail',{m:{from:_(`${j.co} 전사공지`,`${j.co} Announcements`),subject:pick(_(['[전사] 분기 타운홀 안내','[인사] 연말정산 서류 제출 요청','[총무] 사무실 에어컨 점검 안내','[보안] 정기 보안 교육 이수 요망','[복지] 이번 달 생일자 케이크 안내','[전사] 사내 체육대회 참가 신청','[IT] 비밀번호 변경 기한 안내','[인사] 조직 개편 안내'],['[All hands] Quarterly town hall','[HR] Please submit your tax documents','[Facilities] Office AC maintenance','[Security] Mandatory security training','[Perks] Birthday cake for this month','[All hands] Sign up for sports day','[IT] Password change deadline','[HR] Reorg announcement'])),body:_('사내 공지입니다.\n자세한 내용은 사내 메신저를 확인하세요.','Company announcement.\nSee the internal chat for details.')}});
   }
   if(S.hp<=0){
    S.hp=0;j.leaves++;S.stats.leaves++;j.leaveUntil=S.day+45;S.action=null;(S.leaveLog=S.leaveLog||[]).push(S.day);
    addMail(EN?{from:`${j.co} HR`,subject:'[HR] Leave of absence',body:`For health reasons, ${S.name} is placed on leave for 45 days starting today.\n\nLeave does not count as work experience.\nThe leave stays on your record for resume screens for 3 years.\nGet some real rest.`}:{from:`${j.co} 인사팀`,subject:'[인사] 휴직 발령 안내',body:`${S.name}님은 건강상의 이유로 오늘부로 45일간 휴직 처리됩니다.\n\n휴직 기간은 경력으로 인정되지 않습니다.\n휴직 이력은 3년 동안 서류 심사에 남습니다.\n푹 쉬고 돌아오세요.`});
    log(_('과로로 쓰러졌다. 45일간 강제 휴직.','Collapsed from overwork. Forced leave for 45 days.'));
    // every collapse leaves a mark: max HP drops, and the fifth one ends the career
    S.hpMax=Math.max(40,HPM()-10);log(_(`몸이 예전 같지 않다. 최대 체력 ${S.hpMax}.`,`Your body isn't what it used to be. Max HP ${S.hpMax}.`));
    if(S.stats.leaves===5)sched(S.day+3,'mail',{m:EN?{from:'Dr. Han, Family Clinic',subject:'About your test results',body:'This is your fifth collapse.\nI\'ll be blunt: one more and your body won\'t bounce back.\n\nPlease, slow down.'}:{from:'한내과 주치의',subject:'검사 결과 관련해서',body:'벌써 다섯 번째입니다.\n솔직히 말씀드리면, 한 번 더 쓰러지면 몸이 회복하지 못할 수 있어요.\n\n제발 속도를 늦추세요.'}});
   }
  }
 }else{S.hp+=0.8;S.blankDays++;}
 if(S.day%30===0)monthly();
 if(S.money<0){S.hp-=0.25;if(S.day>=30&&S.day-S.momDay>150){S.momDay=S.day;sched(S.day+RI(2,6),'mom');}}
 if(!S.over){
  S.debtDays=S.money<=-1000?(S.debtDays||0)+1:0;
  if(S.debtDays===30)addMail(EN?{from:'Saesol Bank',subject:'[Overdue] Overdraft limit exceeded',body:`Your balance has been below -${MW(1000)} for a month.\nIf this lasts two more months, you won't be able to hold on.`}:{from:'새솔은행',subject:'[연체] 마이너스 통장 한도 초과 안내',body:'잔고가 -1,000만원 아래로 내려간 지 한 달이 되었습니다.\n이대로 두 달이 더 지나면 더는 버티기 어렵습니다.'});
  if(S.debtDays>=90)endGame('home');else if(S.day>=LIMD)endGame('retire');
 }
 S.hp=clamp(S.hp,0,HPM());
 for(const key in k)k[key]=clamp(k[key],0,100);

 if(S.action&&!onLeave){
  S.hp=clamp(S.hp-S.action.per,0,HPM());
  if(S.day>=S.action.end)finishAct();
 }
 runDue();

 const before=S.postings.length;
 S.postings=S.postings.filter(p=>p.until>=S.day);
 if(S.postings.length!==before)UI.dirty=true;
 if(S.postings.length<5||(S.postings.length<12&&Math.random()<0.4)){S.postings.unshift(genPosting());UI.dirty=true;}

 const y=yrs();
 if(y>=2&&Math.random()<0.003*(1+y/5))headhunter();
 if(Math.random()<0.14)sched(S.day,'flavor');

 const pl=plevel();
 if(pl>S.lastPL){S.lastPL=pl;log(_(`커리어 레벨 상승: ${LV[pl-1]} (${titleOf(pl,S.branch)})`,`Career level up: ${LV[pl-1]} (${titleOf(pl,S.branch)})`));}
 if(yrs()>=5&&!S.branch&&!S.branchAsked){S.branchAsked=true;setTimeout(showBranch,50);}
 if(S.day%3===0)save();
}

/* ---------- push ---------- */
function pushNote(m){UI.pushQ.push(m);if(!UI.pushing)nextPush();}
function nextPush(){
 const m=UI.pushQ.shift();const el=$('#push');
 if(!m){UI.pushing=false;return;}
 UI.pushing=true;UI.pushMail=m.id;
 $('#pushFrom').textContent=m.from+_(' · 지금',' · now');$('#pushSubj').textContent=m.subject;
 el.style.top=(document.querySelector('.hd').getBoundingClientRect().bottom+8)+'px';
 el.classList.add('show');
 try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
 clearTimeout(UI.pt);UI.pt=setTimeout(()=>{el.classList.remove('show');setTimeout(nextPush,380);},4500);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button');
 if(!t){if(e.target.id==='ov'&&!UI.sheetLock)closeSheet();if(e.target.closest('#push')){const m=UI.pushMail;$('#push').classList.remove('show');if(m){UI.tab='mail';render();openMail(m);}}return;}
 const d=t.dataset;
 if(d.tab){UI.tab=d.tab;$('#main').scrollTop=0;render();return;}
 if(d.play!==undefined){if(!S)return;UI.impSp=0;if(S.speed>0){UI.lastSp=S.speed;S.speed=0;}else S.speed=UI.lastSp||1;render();save();return;}
 if(d.sp!==undefined){UI.impSp=0;S.speed=+d.sp;render();save();return;}
 if(d.tut!==undefined){closeSheet();UI.tab='home';render();startTut();return;}
 if(d.go){if(d.go==='board-apps'){UI.tab='board';UI.boardSeg='apps';}else UI.tab=d.go;render();return;}
 if(d.seg){UI.boardSeg=d.seg;render();return;}
 if(d.mf){UI.mailF=d.mf;render();return;}
 if(d.star){const m=S.mails.find(x=>x.id===+d.star);if(m){m.star=!m.star;save();openMail(m.id);}return;}
 if(d.post){openPost(+d.post);return;}
 if(d.apply){openResume(+d.apply);return;}
 if(d.close!==undefined){closeSheet();render();return;}
 if(d.tone){UI.ctx.tone=UI.ctx.tone===d.tone?null:d.tone;drawResume();return;}
 if(d.kw){const a=UI.ctx.kws,i=a.indexOf(d.kw);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(d.kw);drawResume();return;}
 if(d.pj){const a=UI.ctx.projects,id=+d.pj,i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(a.length<2)a.push(id);drawResume();return;}
 if(d.submit!==undefined){const ctx=UI.ctx,p=S.postings.find(x=>x.id===ctx.post);if(p&&!p.applied)submitApp(p,{kws:ctx.kws.slice(),projects:ctx.projects.slice(),tone:ctx.tone});closeSheet();UI.tab='board';render();return;}
 if(d.mail){openMail(+d.mail);render();return;}
 if(d.interview){closeSheet();openInterview(+d.interview);return;}
 if(d.ans){answer(d.ans);return;}
 if(d.ivnext!==undefined){UI.iv.react=null;UI.iv.step++;drawInterview();return;}
 if(d.ivend!==undefined){endInterview();render();return;}

 if(d.decline){const a=appById(+d.decline);if(a&&a.stage==='offer'){a.stage='declined';log(_(`${a.p.co} 오퍼를 거절했다.`,`Declined the offer from ${a.p.co}.`));}closeSheet();render();return;}
 if(d.hhyes){const m=S.mails.find(x=>x.id===+d.hhyes);if(m&&!m.done){m.done=true;const p=m.post;const res={kws:p.kws.filter(k=>myKws().includes(k)),projects:S.projects.slice(0,2).map(x=>x.id),tone:null};
   const app={id:nid(),p,res,pw:calcPower(p,res)+6,rq:req(p),pDoc:1,stage:'hhwait',day:S.day};S.apps.unshift(app);S.stats.applied++;sched(S.day+RI(1,4),'hh',{app:app.id});log(_(`헤드헌터를 통해 ${p.co}에 이력서를 넘겼다.`,`Sent your resume to ${p.co} through the headhunter.`));save();}
   closeSheet();render();return;}
 if(d.bill){const [id,i]=d.bill.split(':').map(Number);const m=S.mails.find(x=>x.id===id);if(m&&!m.done)payBill(m,i);save();closeSheet();render();return;}
 if(d.opt){const [k,v]=d.opt.split(':');OPT[k]=k==='noti'?v:+v;saveOpt();
  if(k==='noti'&&v!=='off'&&'Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission().then(showSettings);}catch(e){}}
  showSettings();return;}
 if(d.settings!==undefined){showSettings();return;}
 if(d.awaymail!==undefined){closeSheet();UI.tab='mail';render();return;}
 if(d.hhno){const m=S.mails.find(x=>x.id===+d.hhno);if(m)m.done=true;closeSheet();render();return;}
 if(d.act){startAct(d.act);render();return;}
 if(d.quit!==undefined){showConfirmQuit();return;}
 if(d.quitok!==undefined){log(_(`${S.job.co}에 사직서를 냈다.`,`Handed in a resignation at ${S.job.co}.`));endJob('퇴사');if(S.action&&S.action.type==='rest')S.action=null;closeSheet();save();render();return;}
 if(d.reset!==undefined){showConfirmReset();return;}

 if(d.lang){try{localStorage.setItem(SAVE+'_lang',d.lang);}catch(e){}if(d.lang!==LANG)location.reload();return;}
 if(d.track){UI.nm=$('#nm').value;UI.pickTrack=d.track;showIntro();return;}
 if(d.start!==undefined){startFromIntro();return;}
 if(d.continue!==undefined){const sv=load();if(sv&&(sv.lang||'ko')!==LANG){try{localStorage.setItem(SAVE+'_lang',sv.lang||'ko');sessionStorage.setItem(SAVE+'_cont','1');}catch(e){}location.reload();return;}S=load();if(!S.spv){S.spv=2;if(S.speed>1)S.speed=2;}if(S.action&&!ACTS[S.action.type])S.action=null;if(S.over&&!S.over.parts){if(S.over.kind==='win'){S.over=null;if(S.wonDay==null)S.wonDay=S.day;}else Object.assign(S.over,gradeOf());}if(S.life==null)S.life=160;S.ev=S.ev||{};S.leaveLog=S.leaveLog||[];$('#intro').hidden=true;UI.tab='home';render();if(ended())showEnding();else offline();return;}

 {t:'.timebar',h:'이제 시작!',b:'속도를 골라 시간을 흘려보내세요.\n설정과 튜토리얼 다시 보기는 홈 맨 아래에 있어요.',wait:'sp',do:'원하는 속도를 눌러 보세요'}
];
let C=null;
function startTut(){if(C)return;C={i:0};UI.hold++;$('#coach').hidden=false;C.iv=setInterval(coachPos,200);coachShow();}
function endTut(){if(!C)return;clearInterval(C.iv);C=null;UI.hold--;$('#coach').hidden=true;try{localStorage.setItem(SAVE+'_tut','1');}catch(e){}if(S&&!S.speed)S.speed=UI.lastSp||1;render();}
function coachEl(){const st=TUT[C.i];if(!st.t)return null;const el=document.querySelector(st.t);if(!el)return null;const b=el.getBoundingClientRect();return b.width&&b.height?el:null;}
function coachShow(){
 const st=TUT[C.i],el=coachEl();
 if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
 const live=st.wait&&el;
 $('#coach').classList.toggle('wait',!!live);
 const b=$('#cBub');
 b.innerHTML=`<div class="cstep">${C.i+1} / ${TUT.length}</div><h3></h3><p></p>${live&&st.do?`<div class="cdo">👆 ${st.do}</div>`:''}<div class="cbtns"><button class="cskip" data-cskip>${C.i===TUT.length-1?'':_('튜토리얼 건너뛰기','Skip tutorial')}</button>${!live||st.opt?`<button class="btn" data-cnext>${st.next||(C.i===TUT.length-1?_('시작!','Start!'):_('다음','Next'))}</button>`:''}</div>`;
 b.querySelector('h3').textContent=st.h;b.querySelector('p').textContent=st.b;
 coachPos();setTimeout(coachPos,350);
}
function coachPos(){
 if(!C)return;
 const st=TUT[C.i],el=coachEl(),W=innerWidth,H=innerHeight,set=(id,x,y,w,h)=>{const s=$(id).style;s.left=x+'px';s.top=y+'px';s.width=Math.max(0,w)+'px';s.height=Math.max(0,h)+'px';};
 const b=$('#cBub'),bw=Math.min(340,W-24);b.style.width=bw+'px';const bh=b.offsetHeight;
 if(!el){set('#cbT',0,0,W,H);set('#cbB',0,0,0,0);set('#cbL',0,0,0,0);set('#cbR',0,0,0,0);set('#cBlk',0,0,0,0);$('#cRing').style.display='none';
  b.style.left=(W-bw)/2+'px';b.style.top=Math.max(12,(H-bh)/2)+'px';return;}
 const r=el.getBoundingClientRect(),p=6;
 const x=clamp(r.left-p,0,W),y=clamp(r.top-p,0,H),x2=clamp(r.right+p,0,W),y2=clamp(r.bottom+p,0,H);
 set('#cbT',0,0,W,y);set('#cbB',0,y2,W,H-y2);set('#cbL',0,y,x,y2-y);set('#cbR',x2,y,W-x2,y2-y);
 const live=st.wait;if(live)set('#cBlk',0,0,0,0);else set('#cBlk',x,y,x2-x,y2-y);
 const rg=$('#cRing').style;rg.display='block';rg.left=x+'px';rg.top=y+'px';rg.width=(x2-x)+'px';rg.height=(y2-y)+'px';
 let top;if(H-y2>=bh+14)top=y2+10;else if(y>=bh+14)top=y-bh-10;else top=H-bh-12;
 b.style.top=top+'px';b.style.left=clamp((x+x2)/2-bw/2,12,W-bw-12)+'px';
}
function coachNext(){if(!C)return;C.i++;if(C.i>=TUT.length){endTut();return;}setTimeout(()=>{if(C)coachShow();},60);}
// runs after the game's own click handler, so the screen has already changed
document.addEventListener('click',e=>{
 if(!C)return;
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.cskip!==undefined){endTut();return;}
 if(d.cnext!==undefined){coachNext();return;}
 const st=TUT[C.i];if(!st.wait)return;
 const ev=d.tab?'tab:'+d.tab:d.post?'post':d.apply?'apply':d.tone?'tone':d.kw?'kw':d.pj?'pj':d.submit!==undefined?'submit':(d.sp!==undefined||d.play!==undefined)?'sp':'';
 if(ev===st.wait)coachNext();
});
addEventListener('resize',()=>{if(C)coachPos();});

/* ---------- loop ---------- */
const SPD=[0,1,20,60,180],DAYMS=60000;let last=performance.now(),lastLive=0;
function loop(){
 const now=performance.now(),dt=Math.min(2000,now-last);last=now;
 if(S&&document.hidden&&$('#intro').hidden){if(UI.away&&!UI.sheetLock){const n=Date.now();bgRun(n-UI.wall);UI.wall=n;}}
 else if(S&&UI.hold===0&&S.speed>0&&$('#intro').hidden&&!ended()){
  S.frac=(S.frac||0)+dt*SPD[S.speed]/DAYMS;
  let ticked=false;
  while(S.frac>=1){S.frac-=1;tick();ticked=true;}
  runDue();
  if(UI.dirty&&$('#ov').hidden){render();lastLive=now;}
  else if(ticked||now-lastLive>250){live();lastLive=now;}
 }
 sky();
 if(S&&UI.tab==='home'&&!document.hidden)drawChar();
}
/* ---------- sky ---------- */
const SKY_L=[[0,'#c6cce4','#dcdfec'],[4.5,'#cfd0e8','#e4dfea'],[6.5,'#f4d6c4','#eeeaf0'],[9,'#d5e5f6','#ebf0f6'],[13,'#cbe2f8','#e9f1f9'],[16.5,'#f1e0c2','#eeecef'],[18.5,'#efc3bd','#ddd5ea'],[20.5,'#c9cde6','#dcdfec'],[24,'#c6cce4','#dcdfec']];
const SKY_D=[[0,'#060a15','#0a0f1d'],[4.5,'#11132e','#151427'],[6.5,'#2a1c29','#121829'],[9,'#0f1f39','#0d1423'],[13,'#11264a','#0e1727'],[16.5,'#2a2117','#131725'],[18.5,'#331729','#131431'],[20.5,'#0a0f22','#0b101f'],[24,'#060a15','#0a0f1d']];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>{const x=hex(a),y=hex(b);return`rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')})`};
const mqDark=matchMedia('(prefers-color-scheme: dark)');let skyKey='';
function sky(){
 const h=S?(S.frac||0)*24:12,th=document.documentElement.dataset.theme,dk=th?th==='dark':mqDark.matches;
 const key=dk+':'+h.toFixed(2);if(key===skyKey)return;skyKey=key;
 const K=dk?SKY_D:SKY_L;let i=0;while(K[i+1][0]<=h)i++;
 const a=K[i],b=K[i+1],t=(h-a[0])/(b[0]-a[0]),st=document.getElementById('app').style,sk=document.getElementById('sky').style;
 st.setProperty('--sky1',mix(a[1],b[1],t));st.setProperty('--sky2',mix(a[2],b[2],t));
 // sun 6–18h on an arc, moon 19–5h; fades in/out near the horizon
 let p,c,r;
 if(h>=5.5&&h<=18.5){p=(h-6)/12;const f=Math.min(1,Math.max(0,Math.min(h-5.5,18.5-h)));const low=1-Math.sin(Math.PI*Math.min(1,Math.max(0,p)));
  c=dk?`rgba(255,${Math.round(190-low*70)},${Math.round(110-low*40)},${(.16*f).toFixed(3)})`:`rgba(255,${Math.round(214-low*60)},${Math.round(140-low*50)},${(.55*f).toFixed(3)})`;r='30%';}
 else{const hh=h>=18.5?h-18.5:h+5.5;p=hh/11;const f=Math.min(1,Math.max(0,Math.min(hh,11-hh)));
  c=dk?`rgba(190,205,255,${(.12*f).toFixed(3)})`:`rgba(255,255,255,${(.5*f).toFixed(3)})`;r='22%';}
 const q=Math.min(1,Math.max(0,p));
 sk.setProperty('--gx',(8+84*q).toFixed(1)+'%');sk.setProperty('--gy',(62-Math.sin(Math.PI*q)*40).toFixed(1)+'%');sk.setProperty('--gc',c);sk.setProperty('--gr',r);
}
if(location.hostname==='localhost')window.__ijik={S:()=>S,tick:n=>{for(let i=0;i<n;i++)tick();render();}};
(function(){if(!EN)return;document.title='Easyic-Gak';
 const tl={home:'Home',board:'Offero',mail:'Mail',me:'Career'};
 document.querySelectorAll('#tabs button').forEach(b=>{const n=[...b.childNodes].find(x=>x.nodeType===3&&x.textContent.trim());if(n)n.textContent=tl[b.dataset.tab];});
 const sp=document.querySelectorAll('.hp>span');if(sp[0])sp[0].textContent='HP';if(sp[1])sp[1].textContent='Bank';
 $('#speed').setAttribute('aria-label','Game speed');$('#play').setAttribute('aria-label','Play / pause');})();
showIntro();
try{if(sessionStorage.getItem(SAVE+'_cont')){sessionStorage.removeItem(SAVE+'_cont');const b=document.querySelector('[data-continue]');if(b)b.click();}}catch(e){}
setInterval(loop,100);
})();
